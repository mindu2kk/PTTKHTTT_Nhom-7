name: hoodoomart
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/setup.ps1 first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}
      POSTGRES_DB: ${POSTGRES_DB:-hoodoomart}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hoodoomart}
      LOCAL_ONLY: "true"
      DATA_PROFILE: ${DATA_PROFILE:-demo_seed}
      INFERENCE_URL: http://inference:9000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}","http://127.0.0.1:${WEB_PORT:-3000}","http://localhost:${API_PORT:-8000}","http://127.0.0.1:${API_PORT:-8000}"]'
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment: *api-env
    volumes:
      - ../data/catalog/images:/workspace/data/catalog/images:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  inference:
    environment:
      ASR_MODEL_PROFILE: ${ASR_MODEL_PROFILE:-whisper-base}
    build:
      context: ..
      dockerfile: apps/inference/Dockerfile
    volumes:
      - ../models:/models:ro
    ports:
      - "127.0.0.1:${INFERENCE_PORT:-19090}:9000"
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
      PUBLIC_WEB_PORT: ${WEB_PORT:-3000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    healthcheck:
      test: ["CMD", "node", "-e", "const q=require('http').get({host:'127.0.0.1',port:3000,path:'/api/v1/auth/csrf',headers:{Host:'localhost:'+process.env.PUBLIC_WEB_PORT}},r=>{r.resume();process.exit(r.statusCode===200?0:1)});q.on('error',()=>process.exit(1));q.setTimeout(3000,()=>{q.destroy();process.exit(1)})"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:

