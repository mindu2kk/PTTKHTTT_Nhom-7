[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hoodoomart-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.156.8", "uvicorn==0.38.0", "pydantic==2.12.4",
  "pydantic-settings==2.12.0", "sqlalchemy[asyncio]==2.0.55",
  "psycopg[binary]==3.3.6", "alembic==1.20.0", "python-dotenv==1.2.4",
  "httpx==0.28.1", "pillow==13.0.0", "pgvector==0.4.1", "python-multipart==0.0.20",
  "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.3.0", "httpx==0.28.1", "ruff==0.14.5", "mypy==1.18.2", "playwright==1.56.0", "pymupdf==1.26.6", "pyarrow==23.0.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "unit_tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector", "pgvector.*"]
ignore_missing_imports = true
